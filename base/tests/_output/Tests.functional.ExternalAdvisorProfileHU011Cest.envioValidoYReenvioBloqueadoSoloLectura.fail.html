<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No se pudo enviar</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .swal2-border-radius {
            border-radius: 20px !important;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2) !important;
        }
        .swal2-confirm-btn {
            padding: 12px 30px !important;
            font-size: 1rem !important;
            border-radius: 10px !important;
            font-weight: 600 !important;
        }
    </style>
</head>
<body>
<div class="loader"></div>
<script>
    (function () {
        const icon = "error";
        const title = "No se pudo enviar";
        const message = "Duplicate entry &#039;HU011-20260302013708-3921&#039; for key &#039;unique_external_advisor_request_applicant&#039;";
        const redirectUrl = "http:\/\/localhost\/base\/registro.php";

        Swal.fire({
            icon: icon,
            title: `<strong style="color: #034991;">${title}</strong>`,
            html: `
                <div style="text-align: center; padding: 20px;">
                    <p style="font-size: 1.05rem; margin-top: 10px; color: #333;">${message}</p>
                    <p style="font-size: 0.9rem; color: #999; margin-top: 15px;">
                        Será redirigido automáticamente...
                    </p>
                </div>
            `,
            confirmButtonText: '<i class="bi bi-check2-circle"></i> Aceptar',
            confirmButtonColor: '#034991',
            allowOutsideClick: false,
            allowEscapeKey: false,
            timer: 7000,
            timerProgressBar: true,
            showClass: {
                popup: 'animate__animated animate__fadeInDown'
            },
            hideClass: {
                popup: 'animate__animated animate__fadeOutUp'
            },
            customClass: {
                popup: 'swal2-border-radius',
                confirmButton: 'swal2-confirm-btn'
            }
        }).then(function () {
            window.location.href = redirectUrl;
        });
    })();
</script>
</body>
</html>
