actor: Codeception\Actor
namespace: tests\acceptance
modules:
    enabled:
        - \Helper\Acceptance
        - Db
        - REST:
            url: http://localhost/api
            depends: PhpBrowser
        - PhpBrowser
        - \Helper\Functional
        - \Helper\Unit
settings:
    bootstrap: _bootstrap.php
    colors: true
    memory_limit: 1024M
    extensions:
        enabled:
            - Codeception\Extension\RunFailed
            - Codeception\Extension\Debug
    paths:
        tests: tests
        output: _output
        data: _data
        support: _support
        env: tests/_env
        bootstrap: _bootstrap.php
        helpers: _support
        suites:
            acceptance: tests/acceptance
            functional: tests/functional
            unit: tests/unit