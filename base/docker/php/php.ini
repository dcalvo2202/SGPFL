; ── Extensiones ──────────────────────────────────────────────────────────────
extension=mysqli
extension=ldap
extension=zip
extension=mbstring
extension=fileinfo

; ── Límites de subida (igual que tu php.ini de XAMPP) ───────────────────────
upload_max_filesize = 40M
post_max_size       = 40M
max_execution_time  = 300
max_input_time      = 300
memory_limit        = 512M

; ── Correo (mail() usa msmtp como relay) ─────────────────────────────────────
sendmail_path = /usr/bin/msmtp -t
sendmail_from = rodri100ro@gmail.com

; ── Zona horaria ─────────────────────────────────────────────────────────────
date.timezone = America/Costa_Rica

; ── Errores (cambiar a Off en producción) ────────────────────────────────────
display_errors = On
error_reporting = E_ALL
